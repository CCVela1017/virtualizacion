apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd-ceva

resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/install.yaml

patches:
  - target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
      data:
        server.insecure: "true"
