apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3-whoami
  namespace: parcial-ceva
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app3-whoami
  template:
    metadata:
      labels:
        app: app3-whoami
    spec:
      containers:
        - name: app3-whoami
          image: traefik/whoami
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app3-whoami
  namespace: parcial-ceva
spec:
  selector:
    app: app3-whoami
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app3-whoami
  namespace: parcial-ceva
spec:
  ingressClassName: traefik
  rules:
    - host: app3.parcial.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app3-whoami
                port:
                  number: 80
