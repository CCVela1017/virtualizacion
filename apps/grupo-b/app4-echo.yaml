apiVersion: apps/v1
kind: Deployment
metadata:
  name: app4-echo
  namespace: parcial-ceva
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app4-echo
  template:
    metadata:
      labels:
        app: app4-echo
    spec:
      containers:
        - name: app4-echo
          image: hashicorp/http-echo
          args:
            - "-text=Hola desde la App 4 (parcial-ceva)"
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: app4-echo
  namespace: parcial-ceva
spec:
  selector:
    app: app4-echo
  ports:
    - port: 80
      targetPort: 5678
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app4-echo
  namespace: parcial-ceva
spec:
  ingressClassName: traefik
  rules:
    - host: app4.parcial.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app4-echo
                port:
                  number: 80
