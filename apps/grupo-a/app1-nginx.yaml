apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-nginx
  namespace: parcial-ceva
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app1-nginx
  template:
    metadata:
      labels:
        app: app1-nginx
    spec:
      containers:
        - name: app1-nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app1-nginx
  namespace: parcial-ceva
spec:
  selector:
    app: app1-nginx
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app1-nginx
  namespace: parcial-ceva
spec:
  ingressClassName: traefik
  rules:
    - host: app1.parcial.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app1-nginx
                port:
                  number: 80
