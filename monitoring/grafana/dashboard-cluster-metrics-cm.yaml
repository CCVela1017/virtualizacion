apiVersion: v1
data:
  cluster-metrics.json: |-
    {
      "uid": "cluster-metrics",
      "title": "Metricas del cluster",
      "tags": ["kubernetes"],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": { "query": "label_values(kube_pod_info, namespace)", "refId": "A" },
            "definition": "label_values(kube_pod_info, namespace)",
            "includeAll": true,
            "multi": true,
            "refresh": 2,
            "sort": 1,
            "current": { "selected": true, "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Pods por fase",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 5 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "value_and_name" },
          "targets": [
            { "refId": "A", "expr": "sum by (phase) (kube_pod_status_phase{namespace=~\"$namespace\"})", "legendFormat": "{{phase}}" }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Pods Ready",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 5 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false } },
          "targets": [
            { "refId": "A", "expr": "sum(kube_pod_status_ready{namespace=~\"$namespace\", condition=\"true\"})", "legendFormat": "Ready" }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "CPU por pod (cores)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "x": 0, "y": 5, "w": 12, "h": 9 },
          "fieldConfig": { "defaults": { "unit": "none" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\", container!=\"\", container!=\"POD\"}[5m]))", "legendFormat": "{{namespace}}/{{pod}}" }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Memoria por pod (working set)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "x": 12, "y": 5, "w": 12, "h": 9 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum by (namespace, pod) (container_memory_working_set_bytes{namespace=~\"$namespace\", container!=\"\", container!=\"POD\"})", "legendFormat": "{{namespace}}/{{pod}}" }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Reinicios de contenedores",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "x": 0, "y": 14, "w": 24, "h": 7 },
          "targets": [
            { "refId": "A", "expr": "sum by (namespace, pod) (kube_pod_container_status_restarts_total{namespace=~\"$namespace\"})", "legendFormat": "{{namespace}}/{{pod}}" }
          ]
        }
      ]
    }
kind: ConfigMap
metadata:
  labels:
    grafana_dashboard: "1"
  name: grafana-dashboard-cluster-metrics
  namespace: monitoring-ceva
